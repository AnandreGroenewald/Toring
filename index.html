  <noscript>
    <div class="nojs">Stapel het JavaScript nodig. Skakel dit asseblief aan en laai die bladsy weer.<br>Stapel needs JavaScript. Please turn it on and reload the page.</div>
  </noscript>

  <script>
    // Boot watchdog: if the game hasn't started after 20 s (or a file failed to load),
    // offer a clean reload that clears the offline copy, so a half-updated cache can't trap anyone.
    (function () {
      var shown = false;
      function booted() { return !!(window.__stapel && window.__stapel.booted); }
      function show() {
        if (shown || booted()) return;
        shown = true;
        var box = document.createElement('div');
        box.className = 'nojs';
        box.innerHTML = '<div><p style="margin:0 0 18px">Stapel wil nie laai nie.<br>Stapel won’t load.</p>'
          + '<button type="button" style="font:900 20px/1 inherit;padding:14px 28px;border:0;border-radius:999px;background:#1d2b45;color:#fff">Herlaai · Reload</button></div>';
        box.querySelector('button').onclick = function () {
          var done = function () { location.reload(); };
          var jobs = [];
          try { if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (c) { return caches.delete(c); })); })); } catch (e) {}
          try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })); } catch (e) {}
          Promise.all(jobs).then(done, done);
        };
        document.body.appendChild(box);
      }
      addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t.tagName === 'SCRIPT') show();   // a module or Phaser failed to load
        else if (!booted()) setTimeout(show, 1500); // a crash while starting up
      }, true);
      setTimeout(show, 20000);
    })();
  </script>

  <script src="lib/phaser.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
