<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Die Lewende Toring · proef</title>
<style>
:root{--font:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1838;overflow:hidden;font-family:var(--font);color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.e{font-family:var(--emoji);font-weight:400}
#stage{position:absolute;top:0;left:0;width:412px;transform-origin:0 0;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:412px}
.hidden{display:none!important}

/* the match HUD */
#hud{position:absolute;left:8px;right:8px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.pc{width:150px;padding:7px 8px 8px;border-radius:18px;background:rgba(12,20,50,.86);border:2px solid rgba(255,255,255,.14);box-shadow:0 6px 18px rgba(0,0,0,.28);transition:border-color .2s}
.pc.on{border-color:#ffd23f;box-shadow:0 0 0 3px rgba(255,210,63,.28),0 6px 18px rgba(0,0,0,.28)}
.pc .top{display:flex;gap:7px;align-items:center}
.pc.r .top{flex-direction:row-reverse;text-align:right}
.pc img.av{width:42px;height:42px;border-radius:50%;display:block;flex:none}
.pc .nm{font-size:14.5px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:88px}
.pc .tr{font-size:11.5px;font-weight:800;opacity:.85}
.rk{display:flex;align-items:center;gap:5px;margin-top:6px;padding:3px 6px 3px 4px;border-radius:10px;background:rgba(255,255,255,.07)}
.pc.r .rk{flex-direction:row-reverse}
.rk svg{flex:none}
.rk b{font-size:12.5px;white-space:nowrap}
.lv{flex:none;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:linear-gradient(#7c6cff,#4b3fc4);border:2px solid #fff;display:grid;place-items:center;font-size:11.5px;font-weight:900;margin-left:auto}
.pc.r .lv{margin-left:0;margin-right:auto}
.lv small{font-size:8px;opacity:.85;margin-right:1px}
.pst{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:15px;font-weight:900}
.pc.r .pst{flex-direction:row-reverse}
.chg{display:flex;gap:2px;margin-left:auto}
.pc.r .chg{margin-left:0;margin-right:auto}
.chg i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.chg i.f{background:#ffd23f;box-shadow:0 0 6px #ffd23f}
.away{font-size:11px;font-weight:800;opacity:.9}
#mid{text-align:center;margin-top:4px;text-shadow:0 2px 4px rgba(0,0,0,.5);width:84px}
#mid .tag{font-size:9.5px;font-weight:900;letter-spacing:1px;opacity:.9;text-transform:uppercase}
#mid b{display:block;font-size:15px;line-height:1.15;margin-top:2px}
#mid small{font-size:11.5px;font-weight:800;opacity:.9}
#help{pointer-events:auto;margin-top:6px;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(12,20,50,.7);color:#fff;font:inherit;font-weight:900;font-size:16px}

#toast{position:absolute;left:0;right:0;top:150px;text-align:center;pointer-events:none}
#toast div{display:inline-block;padding:8px 16px;border-radius:999px;background:rgba(10,16,40,.85);font-weight:900;font-size:17px;animation:pop .22s ease-out;max-width:380px}
#toast div.big{font-size:34px;background:none;color:#ffd23f;text-shadow:0 3px 0 #b86d12,0 0 18px rgba(255,210,60,.55)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

#bar{position:absolute;left:8px;right:8px;bottom:10px;padding:10px 12px 12px;border-radius:22px;background:rgba(12,20,50,.9);border:1.5px solid rgba(255,255,255,.14)}
#hint{font-size:14.5px;font-weight:800;text-align:center;line-height:1.3;min-height:19px}
#btns{display:flex;gap:8px;justify-content:center;margin-top:9px;flex-wrap:wrap}
#btns:empty{display:none}
.b{border:0;font:inherit;font-weight:900;font-size:15.5px;color:#fff;padding:11px 15px;border-radius:16px;background:linear-gradient(#ffb04a,#f08a14);box-shadow:0 5px 0 #b86d12;cursor:pointer;white-space:nowrap}
.b:active{transform:translateY(3px);box-shadow:0 2px 0 #b86d12}
.b.alt{background:linear-gradient(#5b6a96,#3b4870);box-shadow:0 5px 0 #262f4d}
.b.grn{background:linear-gradient(#4fd86a,#25a845);box-shadow:0 5px 0 #187a30}
.b.sel{outline:3px solid #ffd23f;outline-offset:2px}
.b:disabled{opacity:.42;cursor:default}

/* menus */
.ov{position:absolute;inset:0;overflow-y:auto;padding:16px 14px 28px;background:linear-gradient(#17285e,#0d1838 60%)}
.ttl{display:flex;align-items:center;gap:10px}
.ttl h1{font-size:25px;line-height:1.05}
.proef{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:1px;background:#ff3d5a;padding:3px 8px;border-radius:99px;vertical-align:middle}
.sub{font-size:13.5px;opacity:.85;margin-top:4px;line-height:1.35}
.sec{font-size:12px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;opacity:.85;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.13);border-radius:18px;padding:11px 12px}
.prof{display:flex;gap:12px;align-items:center;margin-top:14px}
.prof img{width:62px;height:62px;border-radius:50%}
.barline{height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:4px}
.barline i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#d8e2ee,#fff)}
.barline.xp i{background:linear-gradient(90deg,#9d8cff,#6b5cff)}
.opt{display:flex;gap:10px;align-items:flex-start;margin-top:8px;cursor:pointer}
.opt .n{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:19px;background:#2a3a78}
.opt.on{border-color:#ffd23f;background:rgba(255,210,63,.1)}
.opt.on .n{background:#ffd23f;color:#4a2c00}
.opt b{font-size:16px}
.opt p{font-size:13px;opacity:.85;line-height:1.35;margin-top:2px}
.pl{display:flex;align-items:center;gap:9px;margin-top:8px;padding:8px 10px}
.pl img{width:44px;height:44px;border-radius:50%;flex:none}
.pl .who{flex:1;min-width:0}
.pl .who b{font-size:15px}
.pl .who .st{font-size:12px;font-weight:800;opacity:.8}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3cdc5a;margin-right:4px;box-shadow:0 0 6px #3cdc5a}
.dot.busy{background:#ffb02e;box-shadow:0 0 6px #ffb02e}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:2px 7px 2px 3px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:3px}
.tribes{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.tc{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tc img{width:56px;height:56px;border-radius:50%;flex:none}
.tc b{font-size:18px}
.tc .ln{font-size:13px;line-height:1.35;margin-top:3px}
.tc .ln span{font-weight:900}
.vs{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 45%,#2b3f92,#0d1838 70%)}
.vsrow{display:flex;align-items:center;gap:8px}
.vsp{width:160px;text-align:center}
.vsp img{width:104px;height:104px;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.2),0 10px 24px rgba(0,0,0,.4)}
.vsp .nm{font-size:20px;font-weight:900;margin-top:6px}
.vsp .rkbig{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px}
.vsp .rkbig b{font-size:17px}
.vsp .lvbig{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:99px;background:linear-gradient(#7c6cff,#4b3fc4);border:2px solid #fff;font-weight:900;font-size:15px}
.vsx{font-size:44px;font-weight:900;color:#ffd23f;text-shadow:0 3px 0 #b86d12}
.res{text-align:center}
.res h2{font-size:38px;margin-top:20px}
.gain{margin-top:12px;text-align:left}
.gain .row{display:flex;justify-content:space-between;font-weight:900;font-size:15px}
.foot{font-size:11.5px;opacity:.6;text-align:center;margin-top:18px;line-height:1.4}
.rules{position:absolute;inset:0;background:rgba(5,10,30,.82);display:flex;align-items:center;justify-content:center;padding:18px}
.rules .card{background:#17285e;max-width:380px;font-size:14px;line-height:1.45}
.rules h3{font-size:19px;margin-bottom:6px}
.rules li{margin:5px 0 0 18px}
.votecard{margin-top:12px;border-color:#ffd23f;background:linear-gradient(135deg,rgba(255,210,63,.18),rgba(255,120,60,.12))}
.votecard b{font-size:17px}
.vopt{display:flex;gap:10px;align-items:center;margin-top:8px;cursor:pointer;padding:10px 12px}
.vopt .n{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#2a3a78}
.vopt.on{border-color:#ffd23f;background:rgba(255,210,63,.13)}
.vopt.on .n{background:#ffd23f;color:#4a2c00}
.vopt small{display:block;font-size:12px;opacity:.8}
.fld{display:block;margin-top:12px;font-size:13px;font-weight:900;letter-spacing:.3px}
.fld input,.fld textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:16px;font-weight:700}
.fld textarea{min-height:70px;resize:none}
.fld input:focus,.fld textarea:focus{outline:none;border-color:#ffd23f}
.vmsg{min-height:20px;margin-top:8px;font-size:13.5px;font-weight:800;color:#ffb3a8}
.vmsg.ok{color:#7dff9a}
.small{font-size:11.5px;opacity:.75;line-height:1.4;margin-top:10px}
.small a{color:#9fd4ff}
.back{display:inline-block;color:#cfe0ff;font-weight:900;font-size:14px;text-decoration:none;margin-bottom:8px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden">
    <div class="pc" id="pcMe"></div>
    <div id="mid"><div class="tag" id="modeTag"></div><b id="turnLbl"></b><small id="turnCnt"></small><br><button id="help">?</button></div>
    <div class="pc r" id="pcAi"></div>
  </div>
  <div id="toast"></div>
  <div id="bar" class="hidden"><div id="hint"></div><div id="btns"></div></div>
  <div id="menu" class="ov"></div>
  <div id="vs" class="vs hidden"></div>
  <div id="rules" class="rules hidden"></div>
  <div id="vote" class="rules hidden"></div>
</div>

<script>
'use strict';
(() => {
// ============================================================ basics
const Q = new URLSearchParams(location.search);
let SPEED = Number(Q.get('speed')) || 1;
const BOT = Q.get('bot') === '1';
let seed = Number(Q.get('seed')) || ((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const $ = (id) => document.getElementById(id);
const other = (w) => (w === 'me' ? 'ai' : 'me');
const vib = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* no vibration */ } };
const store = { get(k, d) { try { const v = localStorage.getItem('lt.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lt.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } } };

// ============================================================ tribes, cast, ranks
const TR = {
  vuur: { name: 'Vuur', emoji: '🔥', col: '#e8452c', dark: '#8e1d12', light: '#ffb27a', special: 'Veldbrand', sEmoji: '🔥', beats: 'gras',
    sText: 'brand 3 blokke waar jy mik', strong: 'Warmkop: jou missie laai vinniger', weak: 'Water tref jou harder', cast: ['braai', 'rissie', 'draakie', 'vuurhoutjie'], hero: 'draakie' },
  water: { name: 'Water', emoji: '🌊', col: '#1f8fd6', dark: '#134a7d', light: '#9be8ff', special: 'Waterwiel', sEmoji: '🌊', beats: 'vuur',
    sText: 'spoel 3 vloere uit', strong: 'Swemmers: die eerste een wat val, swem terug', weak: 'Gras tref jou harder', cast: ['haai', 'seekat', 'duiker', 'brandweer'], hero: 'haai' },
  gras: { name: 'Gras', emoji: '🌱', col: '#3fae3a', dark: '#2a6a24', light: '#a8f08e', special: 'Rankgryp', sEmoji: '🌿', beats: 'water',
    sText: 'gryp altyd iemand + lig 2 vensters op', strong: 'Wortels: die onderste 3 blokke is veilig', weak: 'Vuur tref jou harder', cast: ['boer', 'bytjie', 'klippie', 'madelief'], hero: 'bytjie' },
};
const AVN = { boer: 'Boer die Bouer', bytjie: 'Bytjie', klippie: 'Klippie', madelief: 'Madelief', braai: 'Braai-Boet', rissie: 'Rissie',
  draakie: 'Draakie', vuurhoutjie: 'Vuurhoutjie', haai: 'Haai-Hennie', seekat: 'Seekat Sannie', duiker: 'Duiker Dirk', brandweer: 'Brandweer-Bettie', rikus: 'Robot Rikus' };
const AV_TEAM = { boer: 'gras', bytjie: 'gras', klippie: 'gras', madelief: 'gras', braai: 'vuur', rissie: 'vuur', draakie: 'vuur', vuurhoutjie: 'vuur',
  haai: 'water', seekat: 'water', duiker: 'water', brandweer: 'water', rikus: 'robot' };
const TEAM_BG = { gras: ['#a8f08e', '#3c9a33'], vuur: ['#ffc37e', '#d9402a'], water: ['#94eaff', '#1878ad'], robot: ['#d7def0', '#6b7896'] };
// (the owner, 15 Oct: "The rankings needs to be more clear … see the other persons ranking with levels")
const TIERS = [['Brons', '#f2b27a', '#a0582a'], ['Silwer', '#ffffff', '#8f9db0'], ['Goud', '#fff0a0', '#d0950e'], ['Platinum', '#d6fbff', '#38b6c9'], ['Diamant', '#e6d8ff', '#7c5cf0']];
const ROMAN = ['I', 'II', 'III'];
function rankOf(pts) { const d = Math.floor(pts / 100); if (d >= 15) return { name: 'Stapel-legende', tier: 4, div: '★', into: pts - 1500, of: 100 }; return { name: `${TIERS[Math.floor(d / 3)][0]} ${ROMAN[d % 3]}`, tier: Math.floor(d / 3), div: ROMAN[d % 3], into: pts % 100, of: 100 }; }
function levelOf(xp) { let lv = 1, need = 120; while (xp >= need) { xp -= need; lv++; need = 100 + lv * 20; } return { lv, into: xp, need }; }
function shieldSVG(tier, div, size) {
  const [, c1, c2] = TIERS[tier];
  return `<svg width="${size}" height="${Math.round(size * 1.15)}" viewBox="0 0 100 115"><defs><linearGradient id="sg${tier}${size}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <path d="M50 4 L92 18 L88 64 Q82 96 50 111 Q18 96 12 64 L8 18 Z" fill="url(#sg${tier}${size})" stroke="#1b2550" stroke-width="6"/>
    <path d="M50 30 L56 44 L71 45 L59 55 L63 70 L50 61 L37 70 L41 55 L29 45 L44 44 Z" fill="#fff" stroke="#1b2550" stroke-width="3"/>
    <text x="50" y="96" text-anchor="middle" font-family="Trebuchet MS" font-weight="900" font-size="24" fill="#1b2550">${div}</text></svg>`;
}

// the sample players "online now" (made up for the preview: no real people)
const ONLINE = [
  { name: 'Ruan', av: 'haai', tribe: 'water', pts: 980, xp: 5200, st: 'in die lobby', busy: false },
  { name: 'Lize', av: 'bytjie', tribe: 'gras', pts: 760, xp: 3900, st: 'in die lobby', busy: false },
  { name: 'Jannie', av: 'braai', tribe: 'vuur', pts: 640, xp: 2500, st: 'speel teen Mia', busy: true },
  { name: 'Mia', av: 'seekat', tribe: 'water', pts: 410, xp: 1400, st: 'speel teen Jannie', busy: true },
  { name: 'Oom Piet', av: 'boer', tribe: 'gras', pts: 150, xp: 520, st: 'in die lobby', busy: false },
];

// ============================================================ avatars (SVG → images)
function flameD(s) { return `M0 0 C ${-s * .75} ${-s * .25} ${-s * .5} ${-s * 1.15} 0 ${-s * 1.75} C ${s * .15} ${-s * 1.15} ${s * .72} ${-s * .95} ${s * .58} ${-s * .3} C ${s * .5} ${-s * .06} ${s * .28} 0 0 0 Z`; }
const petals = (c) => [0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="-5" rx="3.6" ry="5.5" fill="${c}" transform="rotate(${a})"/>`).join('');
const AV_ART = {
  boer: `<path d="M14 104 Q18 76 50 73 Q82 76 86 104 Z" fill="#c9a86b" stroke="#8a6d38" stroke-width="2"/><path d="M42 74 L50 86 L58 74" fill="none" stroke="#8a6d38" stroke-width="2.5"/>
    <circle cx="30" cy="54" r="5.5" fill="#eab48d"/><circle cx="70" cy="54" r="5.5" fill="#eab48d"/><circle cx="50" cy="53" r="20" fill="#f3c29c"/>
    <circle cx="43" cy="50" r="2.8" fill="#2b1a10"/><circle cx="57" cy="50" r="2.8" fill="#2b1a10"/><circle cx="38" cy="58" r="3.6" fill="#f59a8b" opacity=".7"/><circle cx="62" cy="58" r="3.6" fill="#f59a8b" opacity=".7"/>
    <path d="M38 61 Q44 55 50 60 Q56 55 62 61 Q56 65 50 62 Q44 65 38 61 Z" fill="#7a4a22"/><path d="M45 67 Q50 70 55 67" fill="none" stroke="#7a3b22" stroke-width="2" stroke-linecap="round"/>
    <path d="M27 44 Q29 22 50 21 Q71 22 73 44 Z" fill="#ffcc33" stroke="#c4920f" stroke-width="2"/><rect x="22" y="40" width="56" height="7" rx="3.5" fill="#ffd84d" stroke="#c4920f" stroke-width="2"/><rect x="46.5" y="21.5" width="7" height="19" rx="2" fill="#f0b81e"/>`,
  bytjie: `<ellipse cx="30" cy="44" rx="13" ry="18" fill="#fff" opacity=".9" stroke="#b9d3e6" stroke-width="2" transform="rotate(-25 30 44)"/><ellipse cx="70" cy="44" rx="13" ry="18" fill="#fff" opacity=".9" stroke="#b9d3e6" stroke-width="2" transform="rotate(25 70 44)"/>
    <path d="M42 36 Q36 24 30 20" fill="none" stroke="#2b2b2b" stroke-width="2.5"/><circle cx="30" cy="20" r="3.5" fill="#2b2b2b"/><path d="M58 36 Q64 24 70 20" fill="none" stroke="#2b2b2b" stroke-width="2.5"/><circle cx="70" cy="20" r="3.5" fill="#2b2b2b"/>
    <ellipse cx="50" cy="62" rx="24" ry="26" fill="#ffd23f" stroke="#2b2b2b" stroke-width="2.5"/><path d="M28 70 Q50 76 72 70 L72 77 Q50 84 28 77 Z" fill="#2b2b2b"/><path d="M33 83 Q50 89 67 83 L64 88 Q50 92 36 88 Z" fill="#2b2b2b"/>
    <circle cx="42" cy="54" r="6.5" fill="#fff"/><circle cx="58" cy="54" r="6.5" fill="#fff"/><circle cx="43" cy="55" r="3.4" fill="#2b2b2b"/><circle cx="59" cy="55" r="3.4" fill="#2b2b2b"/>
    <circle cx="36" cy="63" r="3.4" fill="#ff9a7a" opacity=".8"/><circle cx="64" cy="63" r="3.4" fill="#ff9a7a" opacity=".8"/><path d="M44 64 Q50 69 56 64" fill="none" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M38 41 Q50 30 62 41 Z" fill="#ff9f1c" stroke="#b86a00" stroke-width="1.8"/><rect x="35" y="39" width="30" height="5" rx="2.5" fill="#ffb347" stroke="#b86a00" stroke-width="1.5"/>`,
  klippie: `<path d="M18 76 Q12 46 36 34 Q56 24 74 36 Q90 50 84 74 Q78 90 50 90 Q24 90 18 76 Z" fill="#a3abb5" stroke="#5d6670" stroke-width="3"/><ellipse cx="68" cy="76" rx="7" ry="4" fill="#8a929c"/>

    G.round++;

    if (G.mode !== 1 && G.sides.me.drops >= G.maxDrops && G.sides.ai.drops >= G.maxDrops) { finishByCount(); break; }
  }
}
function finishByCount() { const a = aliveCount('me'), b = aliveCount('ai'); finish(a > b ? 'me' : b > a ? 'ai' : null, 'tel'); }

// ============================================================ setup + screens
function newMatch(mode, tribe, foe) {
  bid = 0;
  const prof = profile();
  G = { mode, round: 1, time: 0, camY: 0, fx: [], ui: null, sel: null, aimable: null, crane: null, over: false, active: 'me', swimUsed: { me: false, ai: false }, swimBack: [],
    maxDrops: mode === 2 ? 12 : 10, foe,
    sides: { me: newSide('me', tribe, 'Jy', TR[tribe].hero === 'draakie' ? 'braai' : TR[tribe].hero === 'bytjie' ? 'boer' : 'haai', prof.pts, prof.xp),
      ai: newSide('ai', foe.tribe, foe.name, foe.av, foe.pts, foe.xp) },
    towers: mode === 3 ? { shared: { cx: 206, blocks: [] } } : { me: { cx: 108, blocks: [] }, ai: { cx: 304, blocks: [] } } };
  if (mode === 1) {
    for (const who of ['me', 'ai']) {
      const tw = G.towers[who]; let x = 0;
      for (let i = 0; i < 12; i++) { x = clamp(x + R(-6, 6), -12, 12); tw.blocks.push(mkBlock(G.sides[who].tribe, who, i ? x : 0)); }
    }
    const idx = shuffle([...Array(12).keys()]).slice(0, 6);
    resOf('ai').forEach((r, k) => { const b = G.towers.ai.blocks[idx[k]]; b.res = r.id; r.state = 'home'; r.block = b.id; });
  } else if (mode === 2) {
    for (const who of ['me', 'ai']) {
      const tw = G.towers[who];
      for (let i = 0; i < 5; i++) tw.blocks.push(mkBlock(G.sides[who].tribe, who, i ? R(-5, 5) : 0));
      shuffle([0, 1, 2, 3, 4]).slice(0, 3).forEach((k, i) => { const b = tw.blocks[k], r = resOf(who)[i]; b.res = r.id; r.state = 'home'; r.block = b.id; });
    }
  } else {
    G.towers.shared.blocks.push(mkBlock('klip', null, 0, 132));
  }
  for (const id of ['menu']) $(id).classList.add('hidden');
  $('hud').classList.remove('hidden'); $('bar').classList.remove('hidden'); hud();
}
function profile() { return store.get('profile', { name: 'Anandre', pts: 640, xp: 1650, wins: 0 }); }
async function startMatch(mode, tribe, foe) {
  newMatch(mode, tribe, foe);

  runMatch().catch((e) => { console.error(e); toast('Fout: ' + e.message); });
}
function showVs() {
  const v = $('vs'), me = G.sides.me, ai = G.sides.ai;

}
function finish(winner, why) {
  if (G.over) return; G.over = true; G.ui = null; hud();
  const prof = profile(), won = winner === 'me', draw = winner == null;
  const rp = draw ? 0 : won ? (G.sides.ai.pts > prof.pts ? 30 : 22) : -15;
  const xpGain = 40 + aliveCount('me') * 10 + (won ? 30 : 0);
  const before = { rk: rankOf(prof.pts), lv: levelOf(prof.xp) };
  prof.pts = Math.max(0, prof.pts + rp); prof.xp += xpGain; if (won) prof.wins = (prof.wins || 0) + 1; store.set('profile', prof);
  const after = { rk: rankOf(prof.pts), lv: levelOf(prof.xp) };
  if (!BOT) markPlayed(G.mode);
  const why2 = why === 'leeg' ? 'Die toring was leeg terwyl die missie uit was!' : why === 'almal' ? 'Al die inwoners is uit.' : 'Die blokke is op: die meeste mense oor wen.';
  setTimeout(() => {
    $('hud').classList.add('hidden'); $('bar').classList.add('hidden');
    const m = $('menu'); m.classList.remove('hidden');

      <div class="card gain">
        <div class="row"><span>${shieldSVG(after.rk.tier, after.rk.div, 18)} ${after.rk.name}</span><span style="color:${rp >= 0 ? '#7dff9a' : '#ff9a8a'}">${rp >= 0 ? '+' : ''}${rp} rangpunte</span></div>
        <div class="barline"><i style="width:${after.rk.into}%"></i></div>
        ${after.rk.name !== before.rk.name ? `<div style="margin-top:6px;font-weight:900;color:#ffd23f">${prof.pts > 0 && rp > 0 ? 'Op na' : 'Af na'} ${after.rk.name}!</div>` : ''}
        <div class="row" style="margin-top:12px"><span>Vlak ${after.lv.lv}</span><span style="color:#b9b0ff">+${xpGain} XP</span></div>
        <div class="barline xp"><i style="width:${Math.round(after.lv.into / after.lv.need * 100)}%"></i></div>
        ${after.lv.lv > before.lv.lv ? `<div style="margin-top:6px;font-weight:900;color:#b9b0ff">Vlak ${after.lv.lv}! ⬆️</div>` : ''}
      </div>
      <div class="card votecard" style="text-align:left"><b><span class="e">🗳️</span> Hoe hou jy van “${MODES[G.mode].name}”?</b>
        <div style="font-size:13px;margin-top:4px;opacity:.9">${played().length < 3 ? `Jy het ${played().length} van die 3 idees gespeel. Probeer die ander ook, dan stem vir jou gunsteling.` : 'Jy het al drie gespeel: watter een is jou gunsteling?'}</div>
        <div style="margin-top:8px"><button class="b grn" id="voteNow">Stem nou</button></div></div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button class="b" id="again">Speel weer</button><button class="b alt" id="home">Ander idee</button></div></div>`;
    $('voteNow').onclick = () => openVote(G.mode);
    $('again').onclick = () => startMatch(G.mode, G.sides.me.tribe, G.foe);

}

    <div class="card pl"><img src="${URL_.rikus}"><div class="who"><b>Robot Rikus</b><div class="chip">${shieldSVG(1, 'I', 15)} Oefen · <span style="color:#c9c0ff">enige tyd</span></div><div class="st"><span class="dot"></span>altyd reg</div></div><button class="b grn" data-p="rikus">Speel</button></div>

  $('voteBtn').onclick = () => openVote();

  m.querySelectorAll('[data-t]').forEach((el) => { el.onclick = () => { chosenTribe = el.dataset.t; store.set('tribe', chosenTribe); menu(); }; });

$('help').onclick = () => {

// ============================================================ the testers' vote
// (the owner, 15 Oct: "build all three with which one do you like most option for the testers. Then at the end of the week
// we can see who voted for what, their opinion matter")
let API = '';
const apiReady = import('../js/sponsorConfig.js').then((m) => { API = (m.matchApiUrl && m.matchApiUrl()) || ''; }).catch(() => { API = ''; });
function voterId() {
  let id = store.get('voter', null);
  if (!id || !/^[a-z0-9]{12,32}$/.test(id)) { id = Array.from({ length: 16 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join(''); store.set('voter', id); }
  return id;
}
const played = () => store.get('played', []);
function markPlayed(k) { const p = played(); if (!p.includes(k)) { p.push(k); p.sort(); store.set('played', p); } }
function gameName() {
  // the nickname from the real game on this phone (the Uitdagersreeks's "Jou bynaam"), if there is one
  try { const d = JSON.parse(localStorage.getItem('stapel.v1') || 'null'); const n = d && d.duel && d.duel.name; return typeof n === 'string' ? n : ''; } catch (e) { return ''; }
}
function esc(t) { return String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function openVote(pref) {
  const v = $('vote');
  let mine = store.get('vote', null);
  let choice = pref || (mine && mine.choice) || 0;
  // what the tester typed stays across redraws (picking another idea, a message after sending)
  let name = (mine && mine.name) || gameName() || '', reason = (mine && mine.reason) || '';
  const draw = (msg = '', ok = false) => {
    const p = played();
    v.innerHTML = `<div class="card" style="width:100%;max-width:390px;max-height:96%;overflow:auto">
      <h3><span class="e">🗳️</span> Watter idee hou jy die meeste van?</h3>
      <div style="font-size:13px;opacity:.85">Jou stem besluit wat ons bou. ${p.length < 3 ? `Jy het al ${p.length} van die 3 gespeel: probeer al drie as jy kan.` : 'Jy het al drie gespeel. 👏'}</div>
      ${[1, 2, 3].map((k) => `<div class="card vopt ${choice === k ? 'on' : ''}" data-v="${k}"><div class="n">${k}</div><div><b>${MODES[k].name}</b><small>${MODES[k].short}${p.includes(k) ? ' · <span style="color:#7dff9a">gespeel ✓</span>' : ''}</small></div></div>`).join('')}
      <label class="fld">Jou naam of bynaam<input id="vname" maxlength="16" autocomplete="nickname" placeholder="bv. Oom Piet" value="${esc(name)}"></label>
      <label class="fld">Hoekom? <span style="opacity:.7;font-weight:700">(nie nodig nie, maar ons lees elke een)</span><textarea id="vwhy" maxlength="200" placeholder="Wat het jy lekker gekry? Wat moet beter?">${esc(reason)}</textarea></label>
      <div class="vmsg ${ok ? 'ok' : ''}" id="vmsg">${msg}</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:6px"><button class="b grn" id="vsend">${mine ? 'Verander my stem' : 'Stem'}</button><button class="b alt" id="vclose">Later</button></div>
      <div class="small">Ons bêre net jou naam, jou keuse en jou rede, vir hierdie stemming, en vee dit uit ná 8 November 2026. Jonger as 18? Vra eers jou ouer of voog. <a href="../privaatheid.html#stemming">Privaatheid</a></div></div>`;
    $('vname').oninput = (e) => { name = e.target.value; };
    $('vwhy').oninput = (e) => { reason = e.target.value; };
    v.querySelectorAll('[data-v]').forEach((el) => { el.onclick = () => { choice = Number(el.dataset.v); draw(); }; });
    $('vclose').onclick = () => { v.classList.add('hidden'); if (!G) menu(); };
    $('vsend').onclick = () => send();
  };
  const send = async () => {
    name = $('vname').value.trim(); reason = $('vwhy').value.trim();
    if (!choice) { $('vmsg').textContent = 'Kies eers een van die drie idees.'; return; }
    if (name.length < 2) { $('vmsg').textContent = 'Skryf jou naam of bynaam, dan weet Anandre wie gestem het.'; return; }
    $('vsend').disabled = true; $('vmsg').className = 'vmsg'; $('vmsg').textContent = 'Stuur…';
    await apiReady;
    const keep = { choice, name, reason, at: Date.now() };
    if (!API) { $('vmsg').textContent = 'Die stemming is nie hier oop nie (geen bediener).'; $('vsend').disabled = false; return; }
    try {
      const res = await fetch(`${API.replace(/\/+$/, '')}/idees/stem`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ voter: voterId(), choice, name, reason, played: played() }) });
      if (res.ok) { store.set('vote', keep); mine = keep; draw(`Dankie! Jou stem vir “${MODES[choice].name}” tel. 🗳️`, true); $('vsend').disabled = false; vib(30); return; }
      let code = ''; try { code = (await res.json()).error || ''; } catch (e) { code = ''; }
      const why = { invalid_field: 'Die naam werk nie: probeer ’n ander een (letters en syfers, geen vloekwoorde nie).', name_rejected: 'Die naam werk nie: probeer ’n ander een.',
        reason_rejected: 'Jou rede het woorde wat nie mag nie: probeer dit anders sê.', rate_limited: 'Te veel probeer: wag ’n bietjie en probeer weer.', vote_closed: 'Die stemming is klaar. Dankie!' }[code];
      $('vmsg').textContent = why || `Dit het nie gewerk nie (${res.status}). Probeer weer.`;
    } catch (e) { $('vmsg').textContent = 'Geen verbinding nie: probeer weer as jy aanlyn is.'; }
    $('vsend').disabled = false;
  };
  draw(); v.classList.remove('hidden');
}

window.__lt = { openVote, markPlayed, get G() { return G; }, setSpeed: (s) => { SPEED = s; }, startMatch, newMatch, showVs, doSpecial, doThrow, evict, botDrop, botPlace, moveRes, menu, hud, bar, toast, fx, sleep,

(async () => {
